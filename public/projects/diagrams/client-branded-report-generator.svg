<rect width="480" height="520" rx="12" fill="#f8fafc"/>
<rect x="20" y="20" width="440" height="76" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="240" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#312e81">Canvas app</text>
<text x="240" y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Report data and client selection</text>
