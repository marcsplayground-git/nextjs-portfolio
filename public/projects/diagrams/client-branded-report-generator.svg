<svg xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 480 520" role="img" aria-labelledby="title desc">
<title id="title">Client-branded Word reports</title>
<desc id="desc">High-level overview. Arrows show the workflow sequence, not API dependencies.</desc>
