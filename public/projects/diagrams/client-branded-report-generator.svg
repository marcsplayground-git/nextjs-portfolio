<rect x="20" y="120" width="440" height="76" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="240" y="149" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#312e81">Power Automate</text>
<text x="240" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Build report HTML and retrieve template</text>
