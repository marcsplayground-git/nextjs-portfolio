<path d="M240 296 V315" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="320" width="440" height="76" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
<text x="240" y="349" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#312e81">C# Azure Function</text>
<text x="240" y="373" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Merge HTML with template using Open XML SDK</text>
